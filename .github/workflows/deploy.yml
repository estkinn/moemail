name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eSTKim
          fetch-depth: 0  # Get full git history for checking file changes

      - name: Check if tag is on eSTKim branch
        id: check_branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          if git branch -r --contains ${{ github.ref }} | grep -q 'origin/eSTKim'; then
            echo "on_branch=true" >> $GITHUB_OUTPUT
          else
            echo "on_branch=false" >> $GITHUB_OUTPUT
          fi

      - name: Get previous tag
        id: previoustag
        if: github.event_name == 'push' && (github.event_name != 'push' || steps.check_branch.outputs.on_branch == 'true')
        run: |
          echo "tag=$(git describe --tags --abbrev=0 HEAD^)" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Setup pnpm
        if: github.event_name == 'workflow_dispatch' || steps.check_branch.outputs.on_branch == 'true'
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.check_branch.outputs.on_branch == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        if: github.event_name == 'workflow_dispatch' || steps.check_branch.outputs.on_branch == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run deploy script
        if: github.event_name == 'workflow_dispatch' || steps.check_branch.outputs.on_branch == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          KV_NAMESPACE_NAME: ${{ secrets.KV_NAMESPACE_NAME }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: pnpm dlx tsx scripts/deploy/index.ts

      # Clean up
      - name: Post deployment cleanup
        if: github.event_name == 'workflow_dispatch' || steps.check_branch.outputs.on_branch == 'true'
        run: |
          rm -f .env*.*
          rm -f wrangler*.json
